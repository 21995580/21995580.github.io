<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b7d4d9">
<title>角色檔案｜雲間絮語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/story-pages.css?v=20261115-5">
</head>
<body class="story-page" data-page="character">
<div class="story-background" aria-hidden="true"><div class="story-background-image"></div><div class="story-background-wash"></div><div class="story-mist story-mist-one"></div><div class="story-mist story-mist-two"></div></div>
<canvas class="story-petals" aria-hidden="true"></canvas>
<header class="story-header">
  <a class="story-brand" href="index.html">
    <span class="story-brand-mark">✿</span>
    <span><b>雲間絮語</b><small>MOONLIT ATLAS</small></span>
  </a>
  <nav class="story-nav" aria-label="主要導覽">
    <a href="index.html">首頁</a><a class="active" href="works.html">世界觀</a><a href="profile.html">個人檔案</a><a href="faq.html">FAQ</a>
  </nav>
</header>

<main class="character-main">
  <div class="character-page-title"><a id="backToWork" href="works.html">← 返回作品</a><span>CHARACTER FILE</span></div>
  <section class="character-detail-hero">
    <figure class="character-portrait-frame">
      <span class="portrait-flower portrait-flower-a" aria-hidden="true">✿</span>
      <span class="portrait-flower portrait-flower-b" aria-hidden="true">❀</span>
      <img id="characterFullArt" src="images/characters/main.png" alt="角色立繪">
      <figcaption id="portraitCaption"></figcaption>
    </figure>
    <section class="character-profile-panel glass-surface">
      <p class="story-kicker">A SOUL IN THIS WORLD</p>
      <h1 id="characterName">角色姓名</h1>
      <p class="character-en" id="characterEn">CHARACTER</p>
      <div class="story-divider"><i></i><span>◇</span><i></i></div>
      <blockquote id="characterQuote"></blockquote>
      <div class="character-tag-list" id="characterTags"></div>
      <dl class="character-facts" id="characterFacts"></dl>
      <a class="character-play-link is-hidden" id="characterPlay" target="_blank" rel="noreferrer">前往角色互動　↗</a>
    </section>
  </section>

  <section class="character-info-section">
    <div class="panel-heading">
      <div><span class="panel-eyebrow">CHARACTER PROFILE</span><h2>人物誌</h2></div>
    </div>
    <div class="character-info-grid">
      <article class="character-info-card glass-surface">
        <span class="info-card-mark">一</span><h3>角色背景</h3><p id="characterBackground"></p>
      </article>
      <article class="character-info-card glass-surface">
        <span class="info-card-mark">二</span><h3>性格特徵</h3><p id="characterPersonality"></p>
      </article>
      <article class="character-info-card glass-surface">
        <span class="info-card-mark">三</span><h3>角色關係</h3><p id="characterRelationships"></p>
      </article>
    </div>
  </section>

  <section class="other-characters-section">
    <div class="panel-heading"><div><span class="panel-eyebrow">IN THE SAME STORY</span><h2>同一世界的其他角色</h2></div></div>
    <div id="otherCharacters" class="other-character-list"></div>
  </section>
</main>
<footer class="story-footer"><span>✧</span><p>願每個名字，都在故事裡留下光。</p><small>MOONLIT ATLAS</small></footer>
<script src="assets/js/character-detail.js?v=20261115-3"></script>
</body>
</html>
