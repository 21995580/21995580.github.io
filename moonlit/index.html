<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173e50">
<title>雲間絮語｜月相地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f8ffff;--gold:#f0dfbd;--serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --latin:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
html,body{width:100%;height:100%;margin:0}
body{font-family:var(--serif);color:var(--paper);overflow:hidden;background:#183e50}
button,a{font:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #fff4d6;outline-offset:4px}
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:#254c5a}
.scene-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 54%;transform:scale(1.025);filter:saturate(.9) brightness(.82)}
.scene-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,34,48,.26),rgba(10,45,57,.10) 45%,rgba(8,33,47,.36)),linear-gradient(90deg,rgba(8,35,47,.20),transparent 45%,rgba(8,35,47,.17))}
#petalFX,#waterFX{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#petalFX{z-index:1}
#waterFX{z-index:2;opacity:.92;transition:opacity .9s ease}
body.in-site #waterFX{opacity:0}
.site-header{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;padding:24px clamp(22px,5vw,62px);opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .65s,transform .65s,visibility .65s;pointer-events:none}
.site-header.is-visible{opacity:1;visibility:visible;transform:translateY(0)}
.logo{display:flex;align-items:center;gap:12px;color:white;text-decoration:none;text-shadow:0 2px 12px rgba(4,25,37,.8);pointer-events:auto}
.logo-mark{width:43px;height:43px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.62);border-radius:50%;font-size:20px;background:rgba(226,249,244,.10);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.logo b{display:block;font-size:23px;font-weight:500;letter-spacing:.16em}
.logo small{display:block;margin-top:2px;font:500 10px var(--latin);letter-spacing:.28em;color:#f1e6cd}
.welcome{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:28px 22px;opacity:1;visibility:visible;transition:opacity .8s ease,visibility .8s}
.welcome.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
.welcome.is-drawing,.welcome.is-drawing *{-webkit-user-select:none!important;user-select:none!important;-webkit-user-drag:none!important}
.welcome-card{position:relative;width:min(720px,92vw);padding:clamp(44px,7vw,76px) clamp(26px,6vw,72px);text-align:center;isolation:isolate}
.mist-surface{position:absolute;z-index:-1;inset:-82px -145px;border-radius:48% 52% 44% 56% / 54% 44% 56% 46%;
  background:radial-gradient(ellipse at 50% 48%,rgba(223,247,246,.21) 0%,rgba(203,235,235,.14) 43%,rgba(195,232,233,.08) 61%,transparent 79%);
  -webkit-backdrop-filter:blur(23px) saturate(142%);backdrop-filter:blur(23px) saturate(142%);
  -webkit-mask-image:radial-gradient(ellipse at center,#000 42%,rgba(0,0,0,.88) 56%,rgba(0,0,0,.34) 72%,transparent 84%);
  mask-image:radial-gradient(ellipse at center,#000 42%,rgba(0,0,0,.88) 56%,rgba(0,0,0,.34) 72%,transparent 84%);
  filter:drop-shadow(0 0 28px rgba(216,248,245,.12));pointer-events:none;overflow:visible}
.mist-surface:before,.mist-surface:after{content:"";position:absolute;inset:3% 4%;border-radius:inherit;pointer-events:none}
.mist-surface:before{background:radial-gradient(ellipse at 26% 35%,rgba(245,255,253,.18),transparent 34%),radial-gradient(ellipse at 76% 64%,rgba(203,237,237,.16),transparent 38%);filter:blur(20px)}
.mist-surface:after{inset:0;opacity:.075;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
#mistFX{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.welcome-content{position:relative;z-index:2}
.kicker{font:500 12px var(--latin);letter-spacing:.34em;color:#e4f3f0;text-shadow:0 1px 8px rgba(3,25,37,.88)}
.welcome-seal{width:52px;height:52px;margin:0 auto 20px;border:1px solid rgba(255,255,255,.62);border-radius:50%;display:grid;place-items:center;color:#fff4d6;font-size:22px;box-shadow:0 0 28px rgba(211,243,239,.20),inset 0 0 18px rgba(255,255,255,.12);background:rgba(238,255,251,.08);backdrop-filter:blur(10px)}
.welcome h1{margin:16px 0 10px;font-weight:500;letter-spacing:.24em;font-size:clamp(29px,5vw,46px);color:#fff;text-shadow:0 3px 15px rgba(3,24,37,.82)}
.welcome .latin-title{font:400 clamp(19px,3vw,25px) var(--latin);letter-spacing:.22em;color:#f4e8c9;text-shadow:0 2px 12px rgba(3,24,37,.8)}
.welcome-copy{margin:24px auto 0;max-width:490px;font-size:15px;line-height:2.25;letter-spacing:.12em;color:#f6fbfa;text-shadow:0 2px 9px rgba(2,26,39,.92)}
.welcome-rule{display:flex;align-items:center;justify-content:center;gap:13px;margin:24px 0 28px;color:#f1dfb8}
.welcome-rule:before,.welcome-rule:after{content:"";width:74px;height:1px;background:linear-gradient(90deg,transparent,rgba(247,238,209,.78))}
.welcome-rule:after{transform:rotate(180deg)}
.primary{position:relative;min-width:202px;min-height:52px;padding:12px 28px;border:1px solid rgba(232,250,247,.76);border-radius:999px;color:#fff;background:linear-gradient(135deg,rgba(219,247,241,.22),rgba(35,96,110,.34));-webkit-backdrop-filter:blur(14px) saturate(145%);backdrop-filter:blur(14px) saturate(145%);box-shadow:0 0 0 5px rgba(227,250,245,.06),0 10px 30px rgba(3,25,37,.2),inset 0 1px 0 rgba(255,255,255,.48);letter-spacing:.28em;font-size:15px;cursor:pointer;transition:transform .3s,box-shadow .3s,background .3s}
.primary:hover{transform:translateY(-3px);background:linear-gradient(135deg,rgba(236,255,250,.32),rgba(44,120,132,.44));box-shadow:0 0 0 8px rgba(227,250,245,.10),0 0 42px rgba(216,255,250,.28),0 12px 32px rgba(3,25,37,.22)}
.primary:active{transform:translateY(0) scale(.98)}
.home{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:110px 24px 68px;opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.015);transition:opacity .85s,transform .85s,visibility .85s;overflow:auto}
.home.is-visible{opacity:1;visibility:visible;pointer-events:auto;transform:scale(1)}
.home-heading{text-align:center;margin:0 auto 22px;max-width:720px;text-shadow:0 2px 13px rgba(3,25,38,.9)}
.home-heading .eyebrow{font:500 12px var(--latin);letter-spacing:.34em;color:#f0e5ca}
.home-heading h2{margin:12px 0 8px;font-size:clamp(28px,4vw,42px);font-weight:500;letter-spacing:.22em;color:#fff}
.home-heading p{font-size:14px;letter-spacing:.14em;color:#f4fbf9}
.orbs{display:flex;gap:clamp(25px,6vw,82px);align-items:flex-start;justify-content:center;flex-wrap:wrap;width:min(920px,100%);margin:12px auto 0}
.orb{display:block;min-width:170px;padding:0 8px 12px;text-align:center;text-decoration:none;color:#fff;text-shadow:0 2px 12px rgba(3,26,39,.9);border-radius:24px;transition:transform .35s,filter .35s}
.orb-visual{position:relative;display:grid;place-items:center;width:clamp(154px,17vw,184px);aspect-ratio:1.09;margin:0 auto 12px;isolation:isolate;animation:orbFloat 7.2s ease-in-out infinite}
.orb:nth-child(2) .orb-visual{animation-delay:-2.4s}
.orb:nth-child(3) .orb-visual{animation-delay:-4.8s}
.bubble{position:relative;z-index:1;width:clamp(104px,11.6vw,128px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 28% 19%,rgba(255,255,255,.48),rgba(248,255,254,.19) 28%,rgba(225,249,246,.11) 60%,rgba(211,239,235,.07) 100%);
  border:1px solid rgba(247,255,255,.62);-webkit-backdrop-filter:blur(5px) saturate(155%);backdrop-filter:blur(5px) saturate(155%);
  box-shadow:0 0 0 5px rgba(240,255,251,.075),0 0 28px rgba(218,252,249,.22),inset 0 2px 10px rgba(255,255,255,.34),inset 0 -14px 24px rgba(12,52,70,.10);
  transition:transform .45s,box-shadow .45s,background .45s}
.bubble:before{content:"";position:absolute;left:22%;top:14%;width:25%;height:9%;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(5px);transform:rotate(-24deg)}
.bubble:after{content:"";position:absolute;inset:8%;border:1px solid rgba(248,255,255,.19);border-radius:50%;box-shadow:inset 0 0 16px rgba(247,255,255,.08)}
.orb-icon{display:none;width:48%;height:48%;position:relative;z-index:2;overflow:visible;filter:drop-shadow(0 1px 8px rgba(255,255,255,.26))}
.orb-icon path,.orb-icon circle{stroke:#fff;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round;fill:none}
.orb-icon text{fill:#fff;font:400 22px Georgia,serif}
.orb-flora{position:absolute;z-index:2;width:135%;height:135%;object-fit:contain;pointer-events:none;opacity:.92;filter:drop-shadow(0 3px 9px rgba(219,248,246,.2));animation:floraDrift 18s ease-in-out infinite;transition:filter .35s,opacity .35s}
.orb:nth-child(2) .orb-flora{animation-delay:-6s}
.orb:nth-child(3) .orb-flora{animation-delay:-12s}
 .orb:first-child .orb-flora{animation:none}
.orb:hover{transform:translateY(-7px);filter:brightness(1.08)}
.orb:hover .bubble{transform:scale(1.055);background:radial-gradient(circle at 28% 19%,rgba(255,255,255,.56),rgba(250,255,254,.24) 28%,rgba(234,251,248,.14) 60%,rgba(218,243,239,.08) 100%);box-shadow:0 0 0 8px rgba(240,255,251,.12),0 0 44px rgba(218,252,249,.42),inset 0 2px 12px rgba(255,255,255,.43),inset 0 -14px 24px rgba(12,52,70,.08)}
.orb:hover .orb-flora{opacity:1;filter:drop-shadow(0 4px 13px rgba(226,252,248,.38))}
 .orb:first-child:hover .orb-flora{animation:floraDrift 1.8s ease-in-out infinite}
.orb b{display:block;font-size:19px;font-weight:500;letter-spacing:.22em;color:#fff}
.orb span.label-en{display:block;margin-top:5px;font:500 14px var(--latin);letter-spacing:.22em;color:#f1e8d3}
.orb:focus-visible{outline:2px solid #fff4d6;outline-offset:5px}
.enter-label{display:flex;align-items:center;gap:15px;margin:30px 0 0;font-size:13px;letter-spacing:.24em;color:#fff;text-shadow:0 2px 10px rgba(0,22,35,.9)}
.enter-label:before,.enter-label:after{content:"";width:50px;height:1px;background:rgba(244,255,250,.7)}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes floraDrift{0%,100%{transform:rotate(-1deg) scale(1)}50%{transform:rotate(1.5deg) scale(1.025)}}
@media(max-width:760px){
  .site-header{padding:16px 17px}
  .logo b{font-size:18px}.logo-mark{width:37px;height:37px}
  .home{justify-content:flex-start;padding:108px 18px 38px}
  .home-heading{margin-bottom:10px}.home-heading h2{font-size:29px}
  .orbs{gap:14px 10px;margin-top:16px}
  .orb{min-width:calc(33.33% - 10px);padding:0 2px 10px}
  .orb-visual{width:min(27vw,165px)}
  .bubble{width:min(20vw,112px)}
  .orb b{font-size:15px;letter-spacing:.12em}
  .orb span.label-en{font-size:12px}
  .orb-flora{width:137%;height:137%}
  .enter-label{margin-top:18px}
}
@media(max-width:420px){
  .home{padding-top:96px}
  .welcome-card{padding:36px 18px}
  .mist-surface{inset:-62px -64px}
  .welcome-copy{font-size:13px}
  .orbs{gap:14px 2px}
  .orb{min-width:31%}
  .orb-visual{width:30vw}
  .bubble{width:21vw}
  .orb b{font-size:14px}
  .orb-flora{width:145%;height:145%}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <img class="scene-image" src="assets/images/moonlit-landscape.webp?v=20261124-1" alt="">
  <div class="scene-shade"></div>
</div>
<canvas id="petalFX" aria-hidden="true"></canvas>
<canvas id="waterFX" aria-hidden="true"></canvas>

<header class="site-header" id="siteHeader">
  <a class="logo" href="index.html" aria-label="雲間絮語首頁">
    <span class="logo-mark">月</span><span><b>雲間絮語</b><small>MOONLIT ATLAS</small></span>
  </a>
</header>

<section class="welcome" id="welcome" aria-label="歡迎進入雲間絮語">

    <div class="mist-surface" id="mistSurface" aria-hidden="true"><canvas id="mistFX"></canvas></div>
    <div class="welcome-content">
      <div class="welcome-seal" aria-hidden="true">❀</div>
      <p class="kicker">A QUIET WORLD BEYOND THE MOON</p>
      <h1>雲間絮語</h1>
      <p class="latin-title">Whispers Between Clouds</p>
      <p class="welcome-copy">沿著月色與山嵐，尋訪收藏於此的世界、人物與故事。<br>願每一次相遇，都能在雲間留下溫柔的回音。</p>
      <div class="welcome-rule" aria-hidden="true">✧</div>
      <button class="primary" id="enterButton" type="button">踏入仙境　↗</button>
    </div>
  </div>
</section>

<main class="home" id="home" aria-label="網站主要入口">
  <div class="home-heading">
    <p class="eyebrow">A WORLD OF STORIES</p>
    <h2>雲間絮語</h2>
    <p>循著月色與山嵐，尋訪故事的所在</p>
  </div>
  <nav class="orbs" aria-label="主要入口">
    <a class="orb" href="works.html">
      <span class="orb-visual">
        <span class="bubble" aria-hidden="true">
          <svg class="orb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.4C9.6 3.9 6.7 3.7 3.8 4.2v14c3-.5 5.8-.3 8.2 1.2M12 5.4c2.4-1.5 5.3-1.7 8.2-1.2v14c-3-.5-5.8-.3-8.2 1.2M12 5.4v14"/><path d="M6.7 7.5c1.2-.1 2.3.1 3.3.6M17.3 7.5c-1.2-.1-2.3.1-3.3.6"/></svg>
        </span>
        <img class="orb-flora" src="assets/images/world-book-bubble.svg?v=20261124-2" alt="">
      </span>
      <b>世界觀</b><span class="label-en">World</span>
    </a>
    <a class="orb" href="profile.html">
      <span class="orb-visual">
        <span class="bubble" aria-hidden="true">
          <svg class="orb-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.7 20c.6-4.1 3.2-6.2 7.3-6.2s6.7 2.1 7.3 6.2"/></svg>
        </span>
        <img class="orb-flora" src="assets/images/blossom-orbit.webp" alt="">
      </span>
      <b>個人檔案</b><span class="label-en">Profile</span>
    </a>
    <a class="orb" href="faq.html">
      <span class="orb-visual">
        <span class="bubble" aria-hidden="true">
          <svg class="orb-icon" viewBox="0 0 24 24" aria-hidden="true"><text x="12" y="18.3" text-anchor="middle">?</text></svg>
        </span>
        <img class="orb-flora" src="assets/images/blossom-orbit.webp" alt="">
      </span>
      <b>常見問題</b><span class="label-en">FAQ</span>
    </a>
  </nav>
  <p class="enter-label">選擇一扇門，開始你的旅程</p>
</main>

<script>
(() => {
  const welcome=document.getElementById('welcome');
  const home=document.getElementById('home');
  const header=document.getElementById('siteHeader');
  const enter=document.getElementById('enterButton');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let interactionActive=true;

  function enterSite(){
    if(!interactionActive)return;
    interactionActive=false;
    welcome.classList.add('is-leaving');
    home.classList.add('is-visible');
    header.classList.add('is-visible');
    document.body.classList.add('in-site');
    if(location.hash!=='#home')history.replaceState(null,'','#home');
  }
  enter.addEventListener('click',enterSite);
  if(location.hash==='#home'||location.hash==='#homeWorld'){
    welcome.classList.add('is-leaving');
    home.classList.add('is-visible');
    header.classList.add('is-visible');
    document.body.classList.add('in-site');
    interactionActive=false;
  }

  /* 櫻花：使用有花瓣凹口與圓弧邊的輪廓，不再繪製雨滴或雨絲 */
  const petalCanvas=document.getElementById('petalFX');
  const pctx=petalCanvas.getContext('2d',{alpha:true});
  let W=0,H=0,DPR=1,petals=[],lights=[];
  const rand=(a,b)=>a+Math.random()*(b-a);
  function makePetals(){
    petals=[];
    for(let i=0;i<27;i++)petals.push({
      x:rand(0,W),y:rand(0,H),r:rand(4.8,8.2),vy:rand(.18,.55),vx:rand(-.16,.16),
      sway:rand(.22,.82),phase:rand(0,6.28),angle:rand(0,6.28),spin:rand(-.012,.012),
      alpha:rand(.34,.72),tone:rand(0,1)
    });
    lights=[];
    for(let i=0;i<18;i++)lights.push({x:rand(0,W),y:rand(0,H),r:rand(.6,1.5),phase:rand(0,6.28),speed:rand(.0004,.001)});
  }
  function resizePetals(){
    W=window.innerWidth;H=window.innerHeight;DPR=Math.min(window.devicePixelRatio||1,1.5);
    petalCanvas.width=Math.round(W*DPR);petalCanvas.height=Math.round(H*DPR);
    petalCanvas.style.width=W+'px';petalCanvas.style.height=H+'px';
    pctx.setTransform(DPR,0,0,DPR,0,0);makePetals();
  }
  function drawPetal(p){
    pctx.save();pctx.translate(p.x,p.y);pctx.rotate(p.angle);pctx.globalAlpha=p.alpha;
    for(let n=0;n<5;n++){
      pctx.save();pctx.rotate(n*Math.PI*2/5);
      const fill=pctx.createLinearGradient(0,-p.r*1.08,0,0);
      fill.addColorStop(0,p.tone>.5?'rgba(255,244,247,.96)':'rgba(255,226,237,.96)');
      fill.addColorStop(.68,'rgba(249,190,211,.86)');
      fill.addColorStop(1,'rgba(226,151,185,.58)');
      pctx.fillStyle=fill;pctx.beginPath();pctx.moveTo(0,0);
      pctx.bezierCurveTo(-p.r*.46,-p.r*.18,-p.r*.56,-p.r*.82,0,-p.r*1.08);
      pctx.bezierCurveTo(p.r*.56,-p.r*.82,p.r*.46,-p.r*.18,0,0);
      pctx.fill();pctx.strokeStyle='rgba(255,248,249,.42)';pctx.lineWidth=.45;pctx.stroke();
      pctx.restore();
    }
    pctx.fillStyle='rgba(255,244,211,.92)';pctx.beginPath();pctx.arc(0,0,p.r*.14,0,Math.PI*2);pctx.fill();
    pctx.restore();
  }
  let petalFrame=0,lastPetalFrame=0;
  function animatePetals(t){
    if(reduced)return;
    if(t-lastPetalFrame<28){petalFrame=requestAnimationFrame(animatePetals);return}
    lastPetalFrame=t;pctx.clearRect(0,0,W,H);
    for(const p of petals){
      drawPetal(p);p.y+=p.vy;p.x+=p.vx+Math.sin(t*.00055+p.phase)*p.sway*.12;p.angle+=p.spin;
      if(p.y>H+24){p.y=-rand(18,100);p.x=rand(0,W)}
    }
    for(const l of lights){
      const a=.10+.22*(.5+.5*Math.sin(t*l.speed+l.phase));
      pctx.fillStyle='rgba(255,248,226,'+a+')';pctx.beginPath();pctx.arc(l.x,l.y,l.r,0,Math.PI*2);pctx.fill();
    }
    petalFrame=requestAnimationFrame(animatePetals);
  }
  resizePetals();window.addEventListener('resize',resizePetals,{passive:true});
  if(!reduced)petalFrame=requestAnimationFrame(animatePetals);

  /* 霧面玻璃：先鋪一層柔霧，拖曳時以細筆觸擦開 */
  const mistSurface=document.getElementById('mistSurface');
  const mistCanvas=document.getElementById('mistFX');
  const mctx=mistCanvas.getContext('2d');
  let mistW=0,mistH=0,mistDpr=1;
  function seedMist(){
    const rect=mistSurface.getBoundingClientRect();mistW=rect.width;mistH=rect.height;
    mistDpr=Math.min(window.devicePixelRatio||1,1.5);
    mistCanvas.width=Math.max(1,Math.round(mistW*mistDpr));mistCanvas.height=Math.max(1,Math.round(mistH*mistDpr));
    mistCanvas.style.width=mistW+'px';mistCanvas.style.height=mistH+'px';
    mctx.setTransform(mistDpr,0,0,mistDpr,0,0);mctx.clearRect(0,0,mistW,mistH);
    for(let i=0;i<34;i++){
      const x=rand(0,mistW),y=rand(0,mistH),r=rand(34,116);
      const g=mctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(231,249,247,'+rand(.035,.10)+')');
      g.addColorStop(.46,'rgba(219,243,242,'+rand(.025,.065)+')');
      g.addColorStop(1,'rgba(219,243,242,0)');
      mctx.fillStyle=g;mctx.beginPath();mctx.arc(x,y,r,0,Math.PI*2);mctx.fill();
    }
  }
  function clearMistLine(a,b){
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),steps=Math.max(1,Math.ceil(d/4.5));
    mctx.save();mctx.globalCompositeOperation='destination-out';
    for(let i=0;i<=steps;i++){
      const x=a.x+dx*i/steps,y=a.y+dy*i/steps,r=6.2;
      const g=mctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,'rgba(0,0,0,.82)');g.addColorStop(.68,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');
      mctx.fillStyle=g;mctx.beginPath();mctx.arc(x,y,r,0,Math.PI*2);mctx.fill();
    }
    mctx.restore();
  }
  seedMist();window.addEventListener('resize',seedMist,{passive:true});

  /* 手指/滑鼠推動水面：雙高度場的波動方程 + 背景像素折射，只有筆畫造成擾動，不自動生成舊式圓波紋 */
  const waterCanvas=document.getElementById('waterFX');
  const wctx=waterCanvas.getContext('2d',{alpha:true});
  const sceneImage=document.querySelector('.scene-image');
  const sourceCanvas=document.createElement('canvas'),sourceCtx=sourceCanvas.getContext('2d',{willReadFrequently:true});
  const simCanvas=document.createElement('canvas'),simCtx=simCanvas.getContext('2d');
  let simW=0,simH=0,bgData=null,outImage=null,h1=null,h2=null,waterTime=0;
  const damp=.9855,refract=5.5;
  function setupWater(){
    const ww=window.innerWidth,hh=window.innerHeight;
    const dpr=Math.min(window.devicePixelRatio||1,1.5);
    waterCanvas.width=Math.round(ww*dpr);waterCanvas.height=Math.round(hh*dpr);
    waterCanvas.style.width=ww+'px';waterCanvas.style.height=hh+'px';
    wctx.setTransform(dpr,0,0,dpr,0,0);
    simW=Math.min(320,Math.max(150,Math.round(ww/4)));
    simH=Math.max(80,Math.round(simW*hh/ww));
    sourceCanvas.width=simW;sourceCanvas.height=simH;simCanvas.width=simW;simCanvas.height=simH;
    h1=new Float32Array(simW*simH);h2=new Float32Array(simW*simH);
    if(sceneImage.complete&&sceneImage.naturalWidth){
      const scale=Math.max(ww/sceneImage.naturalWidth,hh/sceneImage.naturalHeight)*1.025;
      const sw=ww/scale,sh=hh/scale,sx=(sceneImage.naturalWidth-sw)/2,sy=(sceneImage.naturalHeight-sh)*.54;
      sourceCtx.clearRect(0,0,simW,simH);sourceCtx.filter='saturate(.9) brightness(.82)';
      sourceCtx.drawImage(sceneImage,sx,sy,sw,sh,0,0,simW,simH);sourceCtx.filter='none';
      const shade=sourceCtx.createLinearGradient(0,0,0,simH);
      shade.addColorStop(0,'rgba(9,34,48,.26)');shade.addColorStop(.45,'rgba(10,45,57,.10)');shade.addColorStop(1,'rgba(8,33,47,.36)');
      sourceCtx.fillStyle=shade;sourceCtx.fillRect(0,0,simW,simH);
      bgData=sourceCtx.getImageData(0,0,simW,simH);outImage=simCtx.createImageData(simW,simH);
    }else{bgData=null;outImage=null}
  }
  function poke(cx,cy,strength,radius){
    if(!h1)return;cx|=0;cy|=0;const r2=radius*radius,reach=Math.ceil(radius);
    for(let y=-reach;y<=reach;y++)for(let x=-reach;x<=reach;x++){
      const px=cx+x,py=cy+y;if(px<1||py<1||px>=simW-1||py>=simH-1)continue;
      const f=(x*x+y*y)/r2;if(f>1)continue;
      h1[py*simW+px]+=strength*(.5+.5*Math.cos(Math.PI*Math.sqrt(f)));
    }
  }
  function waterPoint(e){return{x:e.clientX/window.innerWidth*simW,y:e.clientY/window.innerHeight*simH}}
  function stirWater(from,to){
    const dx=to.x-from.x,dy=to.y-from.y,d=Math.hypot(dx,dy);if(d<.65)return;
    const steps=Math.min(9,Math.ceil(d/1.25)),force=Math.min(.48,.13+d*.035);
    for(let i=1;i<=steps;i++)poke(from.x+dx*i/steps,from.y+dy*i/steps,force,1.55);
  }
  function stepWater(){
    waterTime+=.0333;
    for(let y=1;y<simH-1;y++){
      let i=y*simW+1;
      for(let x=1;x<simW-1;x++,i++){
        h2[i]=((h1[i-1]+h1[i+1]+h1[i-simW]+h1[i+simW])*.5-h2[i])*damp;
      }
    }
    const swap=h1;h1=h2;h2=swap;
  }
  function renderWater(){
    if(!bgData||!outImage)return;
    const src=bgData.data,dst=outImage.data;
    for(let y=0;y<simH;y++){
      const yu=y>0?y-1:y,yd=y<simH-1?y+1:y;
      for(let x=0;x<simW;x++){
        const i=y*simW+x,xl=x>0?i-1:i,xr=x<simW-1?i+1:i;
        const gx=h1[xl]-h1[xr],gy=h1[yu*simW+x]-h1[yd*simW+x],mag=Math.abs(gx)+Math.abs(gy),di=i*4;
        if(mag<.0035){dst[di+3]=0;continue}
        let sx=Math.max(0,Math.min(simW-1,Math.round(x+gx*refract)));
        let sy=Math.max(0,Math.min(simH-1,Math.round(y+gy*refract)));
        const si=(sy*simW+sx)*4,shine=Math.max(-24,Math.min(24,gy*26));
        dst[di]=Math.max(0,Math.min(255,src[si]+shine));
        dst[di+1]=Math.max(0,Math.min(255,src[si+1]+shine));
        dst[di+2]=Math.max(0,Math.min(255,src[si+2]+shine*1.18));
        dst[di+3]=Math.max(0,Math.min(150,Math.round(mag*520)));
      }
    }
    simCtx.putImageData(outImage,0,0);wctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    wctx.imageSmoothingEnabled=true;wctx.drawImage(simCanvas,0,0,window.innerWidth,window.innerHeight);
  }
  let drawing=false,lastPoint=null;
  function localMistPoint(e){const r=mistSurface.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  welcome.addEventListener('pointerdown',e=>{
    /* 文字與按鈕只負責閱讀/點擊；只有玻璃留白區才啟動擦霧和水面筆畫 */
    if(!interactionActive||reduced||e.button!==0||e.target.closest('.welcome-content'))return;
    e.preventDefault();
    drawing=true;lastPoint=waterPoint(e);
    poke(lastPoint.x,lastPoint.y,.9,1.8);
    const m=localMistPoint(e);clearMistLine(m,m);
    try{welcome.setPointerCapture(e.pointerId)}catch(_){}
    welcome.classList.add('is-drawing');
  });
  welcome.addEventListener('pointermove',e=>{
    if(!drawing||!interactionActive)return;
    const next=waterPoint(e);stirWater(lastPoint,next);lastPoint=next;
    const m=localMistPoint(e);clearMistLine(mistLast,m);
    mistLast=m;
  });
  let mistLast={x:0,y:0};
  welcome.addEventListener('pointerdown',e=>{if(drawing)mistLast=localMistPoint(e)});
  function stopDrawing(){drawing=false;lastPoint=null;welcome.classList.remove('is-drawing')}
  welcome.addEventListener('pointerup',stopDrawing);welcome.addEventListener('pointercancel',stopDrawing);welcome.addEventListener('lostpointercapture',stopDrawing);window.addEventListener('blur',stopDrawing);
  setupWater();sceneImage.addEventListener('load',setupWater,{once:true});window.addEventListener('resize',setupWater,{passive:true});
  if(!reduced){
    let last=0,acc=0;
    function waterLoop(t){
      if(!interactionActive)return;
      requestAnimationFrame(waterLoop);
      const dt=Math.min(.05,(t-last)/1000||.016);last=t;acc+=dt;
      let n=0;while(acc>=1/30&&n<2){stepWater();acc-=1/30;n++}
      renderWater();
    }
    requestAnimationFrame(waterLoop);
  }
})();
</script>
</body>
</html>
